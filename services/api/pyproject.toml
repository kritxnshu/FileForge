[project]
name = "universal-converter-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "arq>=0.26",
  "redis>=5.0",
  "sse-starlette>=2.1",
  "charset-normalizer>=3.3",
  "olefile>=0.47",
  "defusedxml>=0.7",
  "pyyaml>=6.0",
  "tomli-w>=1.0",
  "Pillow>=11.0",
  "pillow-heif>=0.18",
  "resvg-py>=0.2",
  "pypdf>=5.0",
  "pikepdf>=9.0",
  "pypdfium2>=4.30",
  "pdfplumber>=0.11",
  "reportlab>=4.2",
  "img2pdf>=0.5",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "xlrd>=2.0",
  "odfpy>=1.4",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "fonttools[woff]>=4.53",
  "brotli>=1.1",
  "py7zr>=0.22",
  "segno>=1.6",
  "playwright>=1.47",
  "markdown-it-py>=3.0",
  "zipstream-ng>=1.7",
  "vtracer>=0.6",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "httpx>=0.27",
  "zxing-cpp>=2.2",
]

[tool.uv]
package = false
